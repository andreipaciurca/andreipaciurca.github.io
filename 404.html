<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Terminal Error</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; }
        .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script>
        const el = document.getElementById('terminal');
        async function type(text) {
            for (let char of text) { el.innerHTML += char; await new Promise(r => setTimeout(r, 30)); }
            el.innerHTML += '<br>';
        }
        async function run() {
            await type("> ERROR: 404 - PATH NOT FOUND");
            await type("> systemctl status 404");
            await type("> Redirecting to root in 3 seconds... <span class='blink'>_</span>");
            setTimeout(() => window.location.href = '/', 3000);
        }
        run();
    </script>
</body>
</html>
