<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>404 | Session Not Found</title>
  <style>
    :root {
      --bg-main: #050506;
      --bg-card: rgba(12, 13, 17, 0.96);
      --line: rgba(230, 235, 245, 0.18);
      --text-main: #f3f6fd;
      --text-soft: #c1c9d7;
      --text-dim: #8f98aa;
      --accent-cold: #9cc0ff;
      --accent-warm: #d8aa8a;
      --font-code: "SF Mono", "SFMono-Regular", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      color: var(--text-main);
      font-family: var(--font-code);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.07), transparent 26%),
        radial-gradient(circle at 84% 16%, rgba(156, 192, 255, 0.12), transparent 30%),
        radial-gradient(circle at 76% 84%, rgba(216, 170, 138, 0.12), transparent 26%),
        linear-gradient(180deg, #090a0d, var(--bg-main), #050506);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.34;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.04) 0,
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px,
          transparent 20px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03) 0,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 20px
        );
    }

    .terminal-404 {
      width: min(780px, 100%);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-card);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.56);
    }

    .topbar {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #12131a, #0a0c10);
    }

    .dots {
      display: inline-flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
    }

    .dot.red {
      background: radial-gradient(circle at 30% 24%, #ff8f88, #ed5d5a);
    }

    .dot.yellow {
      background: radial-gradient(circle at 30% 24%, #ffe59a, #f1c154);
    }

    .dot.green {
      background: radial-gradient(circle at 30% 24%, #a2ffba, #4bc884);
    }

    .title {
      margin: 0;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .body {
      padding: 18px 16px 16px;
    }

    .line {
      margin: 0;
      color: var(--text-soft);
      line-height: 1.7;
      font-size: 13px;
    }

    .line + .line {
      margin-top: 4px;
    }

    .prompt {
      color: var(--text-dim);
      margin-right: 6px;
    }

    .typed {
      color: var(--accent-cold);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      margin-left: 2px;
      animation: blink 0.8s step-end infinite;
    }

    .error-code {
      margin: 12px 0 0;
      font-size: clamp(36px, 7vw, 66px);
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--text-main);
    }

    .error-message {
      margin: 8px 0 0;
      color: var(--text-soft);
      line-height: 1.65;
      max-width: 62ch;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .home-link {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      text-decoration: none;
      color: var(--text-main);
      background: linear-gradient(135deg, #121318, #1c1f27 62%, #302924);
      font-size: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .home-link:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.26);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .hint {
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .branch {
      margin-top: 12px;
      color: var(--accent-warm);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }
      50%,
      100% {
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .terminal-404 {
        border-radius: 10px;
      }

      .body {
        padding: 14px 12px 12px;
      }

      .line {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="terminal-404" aria-label="404 terminal window">
    <header class="topbar">
      <div class="dots" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <p class="title">session:not-found</p>
    </header>
    <section class="body">
      <p class="line">
        <span class="prompt">$</span>
        <span class="typed" id="typedCommand"></span>
        <span class="cursor">|</span>
      </p>
      <p class="error-code">404</p>
      <p class="error-message">
        The page you requested is not in this workspace. It may have been moved, removed, or the URL is incorrect.
      </p>
      <div class="actions">
        <a class="home-link" href="/">Open Main Session</a>
        <span class="hint">Tip: check the URL and try again.</span>
      </div>
      <p class="branch" id="branchLine"></p>
    </section>
  </main>

  <script>
    (function init404() {
      var command = "code session --agent=viewer --route=/404 --recover";
      var target = document.getElementById("typedCommand");
      var index = 0;
      var speed = 26;

      function typeNext() {
        index += 1;
        target.textContent = command.slice(0, index);
        if (index < command.length) {
          window.setTimeout(typeNext, speed);
        }
      }

      var now = new Date();
      var month = String(now.getMonth() + 1).padStart(2, "0");
      document.getElementById("branchLine").textContent =
        "feature/" + now.getFullYear() + "-" + month + "-please_hire_me";

      typeNext();
    })();
  </script>
</body>
</html>
