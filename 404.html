<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Terminal Error</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg-main) !important; color: var(--text-main) !important; font-family: var(--font-code); padding: 40px; }
        .terminal { background: #000; color: #f00; padding: 20px; border-radius: 8px; border: 1px solid #f00; }
        .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="terminal" id="terminal"></div>
    <script>
        const el = document.getElementById('terminal');
        async function type(text) {
            for (let char of text) { el.innerHTML += char; await new Promise(r => setTimeout(r, 30)); }
            el.innerHTML += '<br>';
        }
        async function run() {
            await type("> ERROR: 404 - PATH NOT FOUND");
            await type("> systemctl status 404");
            await type("> Redirecting to root... <span class='blink'>_</span>");
            setTimeout(() => window.location.href = '/', 3000);
        }
        run();
    </script>
</body>
</html>
