name: Auto-Update Resume
on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch: 

jobs:
  update-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Create data directory
        run: mkdir -p data
      - name: Fetch LinkedIn data via Apify
        run: |
          curl -s --max-time 120 -X POST \
            "https://api.apify.com/v2/acts/harvestapi~linkedin-profile-scraper/run-sync-get-dataset-items?token=${{ secrets.APIFY_TOKEN }}&format=json" \
            -H "Content-Type: application/json" \
            -d '{"queries":["https://www.linkedin.com/in/andreipaciurca/"]}' \
            -o data/linkedin.json \
          || { echo "Apify fetch failed or timed out; keeping cached data."; }
      - name: Install dependencies
        run: npm ci
      - name: Run Integration Tests
        run: npm test
      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/update-resume.js
      - name: Commit & Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile-data.js data/linkedin.json health.json
          if [[ -n $(git status --porcelain) ]]; then
            if git log -1 --pretty=%B | grep -qF "chore: sync profile data"; then
              git commit --amend --no-edit
              git push --force origin master
            else
              git commit -m "chore: sync profile data"
              git push origin master
            fi
          else
            echo "No changes to commit."
          fi
