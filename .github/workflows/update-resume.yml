name: Auto-Update Resume
on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch: 

jobs:
  update-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create data directory
        run: mkdir -p data
      - name: Fetch from Apify
        run: |
          curl -o data/linkedin.json "https://api.apify.com/v2/datasets/NCpZLymDg8hhxrjDh/items?token=${{ secrets.APIFY_TOKEN }}"
      - name: Install dependencies
        run: npm install
      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-resume.js
      - name: Commit & Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Auto-update profile and health status"
            git push
          else
            echo "No changes to commit."
          fi
