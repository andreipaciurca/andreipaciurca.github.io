name: Auto-Update Resume
on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch: 

jobs:
  update-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create data directory
        run: mkdir -p data
      - name: Fetch LinkedIn data via Apify
        run: |
          curl -s --max-time 120 -X POST \
            "https://api.apify.com/v2/acts/harvestapi~linkedin-profile-scraper/run-sync-get-dataset-items?token=${{ secrets.APIFY_TOKEN }}&format=json" \
            -H "Content-Type: application/json" \
            -d '{"urls":["https://www.linkedin.com/in/andreipaciurca"]}' \
            -o data/linkedin.json \
          || { echo "Apify fetch failed or timed out; keeping cached data."; }
      - name: Install dependencies
        run: npm install
      - name: Run Integration Tests
        run: npm test
      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-resume.js
      - name: Commit & Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile-data.js data/linkedin.json health.json
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Auto-update profile and sync artifacts"
            git push
          else
            echo "No changes to commit."
          fi
